name: Verify exact main

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERIFY_SHA: afc2c92c736d9f496216658261d8a12044ca70d1

jobs:
  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERIFY_SHA }}
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Documentation
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - name: Build release
        run: cargo build --locked --release
      - name: Package
        run: cargo package --locked
      - name: Cargo install
        run: cargo install --path . --locked --force

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VERIFY_SHA }}
      - name: Install Rust 1.82
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Check Rust 1.82
        run: cargo +1.82.0 check --locked --all-targets --all-features
