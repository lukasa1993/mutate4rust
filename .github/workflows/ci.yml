name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: native-rust-hardening-v21
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Apply rustfmt to hardening branch
        run: |
          cargo fmt --all
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Apply rustfmt to native hardening"
            git push origin HEAD:native-rust-hardening-v21
          fi
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Build release binary
        run: cargo build --release
      - name: Cargo install smoke test
        run: |
          cargo install --path . --root target/native-install --force
          target/native-install/bin/mutate4rust --version
          target/native-install/bin/mutate4rust --help
