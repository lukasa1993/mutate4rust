name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-reproducibility-v202
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Regenerate and commit Cargo.lock
        run: |
          cargo +stable generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Cargo.lock; then
            git add Cargo.lock
            git commit -m "Lock tempfile 3.20 for Rust 1.82"
            git push origin HEAD:release-reproducibility-v202
          fi
      - name: Stable checks
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --locked --all-targets --all-features -- -D warnings
          cargo +stable test --locked --all-targets --all-features
      - name: Rust 1.82 check
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.82.0 check --locked --all-targets --all-features
