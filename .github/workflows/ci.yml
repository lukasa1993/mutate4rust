name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-cargo-cfg:
    if: github.ref == 'refs/heads/cargo-cfg-v204' || github.event.pull_request.head.ref == 'cargo-cfg-v204'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cargo-cfg-v204
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Integrate and verify exact Cargo cfg discovery
        shell: bash
        run: |
          if grep -q 'fn cargo_cfg(' src/scope.rs; then
            echo 'Cargo cfg fidelity patch is already integrated.'
            exit 0
          fi
          mkdir -p target
          rustc tools/patch_cargo_cfg.rs -o target/patch-cargo-cfg
          target/patch-cargo-cfg
          cargo fmt --all
          cargo check --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo check --locked --all-targets --all-features
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/scope.rs
          git commit -m "Use Cargo compiler cfg for mutation scope"
          git fetch origin cargo-cfg-v204
          git rebase origin/cargo-cfg-v204
          git push origin HEAD:cargo-cfg-v204

  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Verify lockfile is current
        run: cargo metadata --locked --format-version 1 --no-deps > ${{ runner.temp }}/metadata.json
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Build release
        run: cargo build --locked --release
      - name: Cargo install smoke test
        shell: bash
        run: |
          cargo install --path . --locked --root target/native-install --force
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            target/native-install/bin/mutate4rust.exe --version
            target/native-install/bin/mutate4rust.exe --help >/dev/null
          else
            target/native-install/bin/mutate4rust --version
            target/native-install/bin/mutate4rust --help >/dev/null
          fi

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.82
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Check declared MSRV with locked dependencies
        run: cargo +1.82.0 check --locked --all-targets --all-features
