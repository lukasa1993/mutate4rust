name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-audit-branch:
    if: github.ref == 'refs/heads/audit-restoration-20260823' || github.head_ref == 'audit-restoration-20260823'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-restoration-20260823
      - name: Install Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply embedded native Rust patch and clean audit files
        shell: bash
        run: |
          awk '
            /cat > "\$RUNNER_TEMP\/patch.rs" <<'"'"'RS'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*RS$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/audit-apply-restoration.yml > "$RUNNER_TEMP/patch.rs"
          test -s "$RUNNER_TEMP/patch.rs"
          rustc --edition=2021 "$RUNNER_TEMP/patch.rs" -o "$RUNNER_TEMP/patch"
          "$RUNNER_TEMP/patch"
          cargo fmt --all
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/audit-apply-restoration.yml
          rm -f .github/audit-restoration-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs .github/workflows/ci.yml .github/audit-restoration-trigger.txt
          git commit -m 'Finalize byte-for-byte restoration repair'
          git push origin HEAD:audit-restoration-20260823

  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Verify lockfile is current
        run: cargo metadata --locked --format-version 1 --no-deps > ${{ runner.temp }}/metadata.json
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Documentation
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - name: Build release
        run: cargo build --locked --release
      - name: Package
        run: cargo package --locked
      - name: Cargo install
        run: cargo install --path . --locked --force
      - name: Cargo install smoke test
        shell: bash
        run: |
          cargo install --path . --locked --root target/native-install --force
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            target/native-install/bin/mutate4rust.exe --version
            target/native-install/bin/mutate4rust.exe --help >/dev/null
          else
            target/native-install/bin/mutate4rust --version
            target/native-install/bin/mutate4rust --help >/dev/null
          fi
      - name: End-to-end explicit feature selection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixture="$GITHUB_WORKSPACE/tests/fixtures/feature-crate"
          tool="$GITHUB_WORKSPACE/target/native-install/bin/mutate4rust"
          default_output="$($tool --root "$fixture" --list --json)"
          printf '%s\n' "$default_output"
          if grep -q '"original": "true"' <<<"$default_output"; then
            echo 'feature-only mutation leaked into default feature scope' >&2
            exit 1
          fi
          feature_output="$($tool --root "$fixture" --features extra --list --json)"
          printf '%s\n' "$feature_output"
          grep -q '"original": "true"' <<<"$feature_output"
          grep -q '"replacement": "false"' <<<"$feature_output"

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.82
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Check declared MSRV with locked dependencies
        run: cargo +1.82.0 check --locked --all-targets --all-features
