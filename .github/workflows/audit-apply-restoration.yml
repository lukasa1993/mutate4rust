name: Apply restoration repair

on:
  push:
    branches: [audit-restoration-20260823]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[restoration-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-restoration-20260823
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply repair with native Rust
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/patch.rs" <<'RS'
