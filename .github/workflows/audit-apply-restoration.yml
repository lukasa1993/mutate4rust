                mutation: mutation.clone(),
                status: Status::Invalid,
                exit_code: None,
                duration_seconds: 0.0,
                detail: Some("mutated source does not parse".into()),
            };
            guard.restore()?;
            results.push(result);
            continue;
        }
        if let Some(command) = validate_command {
            let validation = match run_shell(command, root, timeout) {
