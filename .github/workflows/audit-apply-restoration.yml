                    detail: Some(detail),
                };
                guard.restore()?;
                results.push(result);
                continue;
            }
        }
        let execution = match run_shell(test_command, root, timeout) {
            Ok(result) => result,
            Err(error) => {
                guard.restore()?;
                return Err(error);
            }
        };
        let (status, detail) = if execution.timed_out {
            (Status::Timeout, Some("test command timed out".into()))
        } else if execution.exit_code == Some(0) {
            (Status::Survived, None)
        } else {
