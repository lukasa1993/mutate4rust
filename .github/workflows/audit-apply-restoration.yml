                  r##"struct SourceGuard {
    path: PathBuf,
    original: Vec<u8>,
    journal: PathBuf,
}

impl SourceGuard {
    fn apply(root: &Path, mutation: &Mutation) -> Result<Self, Error> {
        let path = resolve_source_path(root, &mutation.file)?;
        let original = fs::read(&path)?;
        let journal = root.join(JOURNAL);
        if let Some(parent) = journal.parent() {
            fs::create_dir_all(parent)?;
        }
        let record = JournalRecord {
            file: mutation.file.clone(),
            content: BASE64.encode(&original),
        };
        fs::write(&journal, serde_json::to_vec_pretty(&record)?)?;
        let mut changed = original.clone();
        changed.splice(
            mutation.start..mutation.end,
            mutation.replacement.as_bytes().iter().copied(),
        );
        fs::write(&path, changed)?;
        Ok(Self {
            path,
            original,
            journal,
        })
    }
}

impl Drop for SourceGuard {
    fn drop(&mut self) {
        if fs::write(&self.path, &self.original).is_ok() {
            let _ = fs::remove_file(&self.journal);
        }
    }
}
"##,
                  r##"struct SourceGuard {
    path: PathBuf,
    original: Vec<u8>,
    journal: PathBuf,
    restored: bool,
}

impl SourceGuard {
    fn apply(root: &Path, mutation: &Mutation) -> Result<Self, Error> {
        let path = resolve_source_path(root, &mutation.file)?;
        let original = fs::read(&path)?;
        let journal = root.join(JOURNAL);
        if let Some(parent) = journal.parent() {
            fs::create_dir_all(parent)?;
        }
        let record = JournalRecord {
            file: mutation.file.clone(),
            content: BASE64.encode(&original),
        };
        fs::write(&journal, serde_json::to_vec_pretty(&record)?)?;
        let mut changed = original.clone();
        changed.splice(
            mutation.start..mutation.end,
            mutation.replacement.as_bytes().iter().copied(),
        );
        fs::write(&path, changed)?;
        Ok(Self {
            path,
            original,
            journal,
            restored: false,
        })
    }

    fn restore(&mut self) -> Result<(), Error> {
        fs::write(&self.path, &self.original)?;
        let observed = fs::read(&self.path)?;
        if observed != self.original {
            return Err(Error::Mutation(format!(
                "source restoration verification failed for {}",
                self.path.display()
            )));
        }
        fs::remove_file(&self.journal)?;
        self.restored = true;
        Ok(())
    }
}

impl Drop for SourceGuard {
    fn drop(&mut self) {
        if self.restored {
            return;
        }
        if fs::write(&self.path, &self.original).is_ok()
            && fs::read(&self.path).is_ok_and(|value| value == self.original)
        {
            let _ = fs::remove_file(&self.journal);
        }
    }
}
