name: Audit format branch

on:
  push:
    branches: [audit-test-cfg-scope-20260823]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-test-cfg-scope-20260823
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scope.rs
          git commit -m 'Format cfg scope repair [auto-fmt]'
          git push origin HEAD:audit-test-cfg-scope-20260823
