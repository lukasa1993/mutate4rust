version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "clap"
        versions:
          - ">= 4.5.51"
      - dependency-name: "tempfile"
        versions:
          - ">= 3.27.0"
