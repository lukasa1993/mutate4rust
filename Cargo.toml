[package]
name = "mutate4rust"
version = "2.0.1"
edition = "2021"
rust-version = "1.82"
description = "Native syntax-aware mutation testing for Rust"
license = "MIT"
repository = "https://github.com/lukasa1993/mutate4rust"
readme = "README.md"
keywords = ["rust", "mutation", "testing", "quality"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2"
wait-timeout = "0.2"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
